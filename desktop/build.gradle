plugins { id 'application' }

group = 'com.cyberpunkdiario'
version = '1.8.0'

application {
    mainClass = 'com.cyberpunkdiario.desktop.DesktopServer'
}

tasks.named('processResources') {
    from('../app/src/main/assets') {
        into 'web'
    }
}

tasks.named('jar') {
    archiveBaseName = 'CyberpunkDiarioDesktop'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}