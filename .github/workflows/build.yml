name: Cyberpunk Diary — Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-diary-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read app version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      apk_ready: ${{ steps.signing.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npm run icons
          npm run build:web
          npx cap sync android
      - name: Check persistent Android signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK não publicado: configure os quatro segredos de assinatura Android no repositório."
          fi
      - name: Configure permanent Android signing and version code
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/cyberpunk-diary-release.p12
          cat > android/keystore.properties <<EOF
          storeFile=cyberpunk-diary-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {10000 + int(os.environ["BUILD_NUMBER"])}', source, count=1)
          source, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{os.environ["APP_VERSION"]}"', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Não foi possível definir versionCode/versionName no Gradle")
          source += """
          
          // Signing persistente para permitir atualização sobre a versão anterior.
          android {
              signingConfigs {
                  release {
                      def signingProps = new Properties()
                      def signingFile = rootProject.file("keystore.properties")
                      signingProps.load(new FileInputStream(signingFile))
                      storeFile file(signingProps["storeFile"])
                      storePassword signingProps["storePassword"]
                      keyAlias signingProps["keyAlias"]
                      keyPassword signingProps["keyPassword"]
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          """
          gradle.write_text(source)
          PY
      - name: Build signed, updateable Android APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../CyberpunkDiary-Android-${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: CyberpunkDiary-Android-${{ needs.prepare.outputs.version }}
          path: CyberpunkDiary-Android-${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate app icons and native GPS bridge
        run: |
          npm run icons
          npm run build:web
      - name: Build Windows installer
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: CyberpunkDiary-Windows-${{ needs.prepare.outputs.version }}
          path: dist/windows/*.exe
          if-no-files-found: error

  release:
    needs: [prepare, android, windows]
    if: always() && needs.prepare.result == 'success' && needs.windows.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CyberpunkDiary-Windows-${{ needs.prepare.outputs.version }}
          path: release
      - name: Download Android APK when signing is configured
        if: needs.android.outputs.apk_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: CyberpunkDiary-Android-${{ needs.prepare.outputs.version }}
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APK_READY: ${{ needs.android.outputs.apk_ready }}
        run: |
          if [ "$APK_READY" = "true" ]; then
            NOTES="Cyberpunk Diary $APP_VERSION. APK Android assinado com chave persistente para atualizações in-place e instalador Windows."
          else
            NOTES="Cyberpunk Diary $APP_VERSION. Instalador Windows. APK aguardando configuração da chave persistente de assinatura Android nos GitHub Actions secrets."
          fi
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "v$APP_VERSION" release/* --repo "$GITHUB_REPOSITORY" --title "Cyberpunk Diary $APP_VERSION" --notes "$NOTES"
          fi
