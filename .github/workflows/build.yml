name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create . --platforms=windows
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cyberpunk-diary-windows.zip
        shell: pwsh
      - run: choco install innosetup --no-progress -y
        shell: pwsh
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: CyberpunkDiary-Setup-1.0.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: cyberpunk-diary-windows.zip
  sync-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - working-directory: sync-host
        run: go test ./...
      - working-directory: sync-host
        run: go vet ./...
  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows, sync-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist/portable
      - run: mv dist/android/app-release.apk dist/android/CyberpunkDiary-Android-1.0.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/android/CyberpunkDiary-Android-1.0.0.apk
            dist/windows/CyberpunkDiary-Setup-1.0.0.exe
            dist/portable/cyberpunk-diary-windows.zip
          tag_name: v1.0.0
          name: Cyberpunk Diary v1.0.0
          target_commitish: main
          generate_release_notes: true
