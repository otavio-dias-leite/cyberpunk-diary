name: Build Cyberpunk Diário Android and Desktop

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'desktop/**'
      - '*.gradle'
      - '*.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Configure persistent Android signing key when available
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cyberpunk-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are unavailable; building a debug APK for fresh installation."
          fi
      - name: Compile signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cyberpunk-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Compile debug APK when persistent signing is unavailable
        if: steps.signing.outputs.available != 'true'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage APK and generate checksum
        run: |
          mkdir -p app/build/distribution
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -s "$APK"
          cp "$APK" app/build/distribution/Cyberpunk-Diario-Android.apk
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            echo "APK_TYPE=release-signed" > app/build/distribution/BUILD-INFO.txt
          else
            echo "APK_TYPE=debug-signed; fresh installation only; not guaranteed to update an existing installation" > app/build/distribution/BUILD-INFO.txt
          fi
          cd app/build/distribution
          sha256sum Cyberpunk-Diario-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: app/build/distribution/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile desktop server and embedded app
        run: gradle --no-daemon :desktop:jar
      - name: Package Windows executable with bundled Java runtime
        shell: pwsh
        run: |
          jpackage --type app-image --input desktop/build/libs --dest desktop/build/installer --name CyberpunkDiario --main-jar CyberpunkDiarioDesktop.jar --main-class com.cyberpunkdiario.desktop.DesktopServer --app-version 1.10.2 --vendor "Otavio Dias Leite"
          Compress-Archive -Path desktop/build/installer/CyberpunkDiario -DestinationPath desktop/build/Cyberpunk-Diario-Desktop-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: desktop/build/Cyberpunk-Diario-Desktop-Windows.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build Linux desktop application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile desktop server and embedded app
        run: gradle --no-daemon :desktop:jar
      - name: Package Linux application with bundled Java runtime
        run: |
          jpackage --type app-image --input desktop/build/libs --dest desktop/build/installer --name CyberpunkDiario --main-jar CyberpunkDiarioDesktop.jar --main-class com.cyberpunkdiario.desktop.DesktopServer --app-version 1.10.2 --vendor "Otavio Dias Leite"
          tar -czf desktop/build/Cyberpunk-Diario-Desktop-Linux.tar.gz -C desktop/build/installer CyberpunkDiario
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Linux
          path: desktop/build/Cyberpunk-Diario-Desktop-Linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Android, Windows and Linux release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Linux
          path: release/linux
      - name: Publish Android, Windows and Linux downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.2
          name: Cyberpunk Diário 1.10.2
          body: |
            Cyberpunk Diário 1.10.2 — Android, Windows e Linux.

            Os pacotes Android, Windows e Linux são gerados automaticamente pelo GitHub Actions.
            Se a chave Android persistente estiver configurada, o APK será assinado para atualização direta.
            Se não estiver, será publicado um APK de depuração para instalação nova; nesse caso, ele não substitui uma instalação assinada anteriormente.

            Para sincronizar Android e desktop: execute CyberpunkDiario.exe no Windows ou o executável CyberpunkDiario no Linux, instale Tailscale nos dispositivos, entre na mesma conta, faça o pareamento uma única vez. Depois disso, o aplicativo detecta quando o Tailscale está ativo e reconecta/sincroniza automaticamente, mesmo em redes diferentes.

            O servidor usa HTTP autenticado por token dentro da rede privada criptografada pelo Tailscale. Não encaminhe a porta 8765 para a internet. Não é necessário ativar Exit Node.
          files: |
            release/android/Cyberpunk-Diario-Android.apk
            release/android/BUILD-INFO.txt
            release/android/SHA256SUMS.txt
            release/windows/Cyberpunk-Diario-Desktop-Windows.zip
            release/linux/Cyberpunk-Diario-Desktop-Linux.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
