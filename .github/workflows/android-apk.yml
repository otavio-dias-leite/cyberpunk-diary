name: Build Cyberpunk Diário Android and Windows

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'windows/**'
      - '*.gradle'
      - '*.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/main/assets/accounts.js
          node --check app/src/main/assets/bridge.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/calendar-ux.js
          node --check app/src/main/assets/sync-ux.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Configure persistent Android signing key when available
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cyberpunk-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are unavailable; building a debug APK for fresh installation."
          fi
      - name: Compile signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cyberpunk-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Compile debug APK when persistent signing is unavailable
        if: steps.signing.outputs.available != 'true'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage APK and generate checksum
        run: |
          mkdir -p app/build/distribution
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -s "$APK"
          cp "$APK" app/build/distribution/Cyberpunk-Diario-Android.apk
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            echo "APK_TYPE=release-signed" > app/build/distribution/BUILD-INFO.txt
          else
            echo "APK_TYPE=debug-signed; fresh installation only; not guaranteed to update an existing installation" > app/build/distribution/BUILD-INFO.txt
          fi
          cd app/build/distribution
          sha256sum Cyberpunk-Diario-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: app/build/distribution/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build native Windows application
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows application
        shell: pwsh
        run: |
          dotnet publish windows/CyberpunkDiario.csproj -c Release -r win-x64 --self-contained true -o windows/publish
          Compress-Archive -Path windows/publish/* -DestinationPath windows/Cyberpunk-Diario-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: windows/Cyberpunk-Diario-Windows.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Android and Windows releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: release/windows
      - name: Read application version
        id: app-version
        run: |
          VERSION=$(awk -F"\047" '/versionName/ {print $2; exit}' app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish Android and Windows downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app-version.outputs.tag }}
          name: Cyberpunk Diário ${{ steps.app-version.outputs.version }}
          body: |
            Cyberpunk Diário ${{ steps.app-version.outputs.version }} — grande atualização visual e funcional.

            Android: navegação voltar integrada, interface adaptada a telas pequenas, botões com áreas de toque maiores, descoberta LAN fora da thread de interface e tema Soulkiller refinado.
            Agenda: correções de recorrência diária/semanal/mensal, criação de rotinas, prevenção de cartões duplicados, compartilhamento de tarefas e manutenção de backup local.
            Windows: aplicativo nativo com sincronização direta pela rede local.

            A sincronização LAN usa autenticação por código de pareamento. O firewall do Windows deve permitir o aplicativo em redes privadas. Não exponha as portas 8765 e 8766 à internet.
            O APK mantém o applicationId e incrementa o versionCode. Atualizações Android exigem a mesma chave de assinatura; sem o keystore anterior, faça backup e reinstale.
          files: |
            release/android/Cyberpunk-Diario-Android.apk
            release/android/BUILD-INFO.txt
            release/android/SHA256SUMS.txt
            release/windows/Cyberpunk-Diario-Windows.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
