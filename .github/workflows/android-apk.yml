name: Build Cyberpunk Diário Android and Desktop

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'desktop/**'
      - '*.gradle'
      - '*.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Generate checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile desktop server and embedded app
        run: gradle --no-daemon :desktop:jar
      - name: Package Windows executable with bundled Java runtime
        shell: pwsh
        run: |
          jpackage --type app-image --input desktop/build/libs --dest desktop/build/installer --name CyberpunkDiario --main-jar CyberpunkDiarioDesktop.jar --main-class com.cyberpunkdiario.desktop.DesktopServer --app-version 1.5.0 --vendor "Otavio Dias Leite"
          Compress-Archive -Path desktop/build/installer/CyberpunkDiario -DestinationPath desktop/build/Cyberpunk-Diario-Desktop-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: desktop/build/Cyberpunk-Diario-Desktop-Windows.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: release/windows
      - name: Publish Android and Windows downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: Cyberpunk Diário 1.5.0
          body: |
            Cyberpunk Diário 1.5.0 — Android + Windows Desktop.

            - Rotinas editáveis com subtarefas e checklists diários que reiniciam sem apagar o histórico.
            - Links associados a tarefas e rotinas.
            - Calendário mensal expandido, com texto em várias linhas.
            - Semana com colunas ampliadas e melhor aproveitamento da tela.
            - Aplicativo Windows com servidor local e sincronização bidirecional pela rede Wi-Fi.
            - Android mantém o mesmo applicationId e incrementa versionCode para atualização direta.

            Para sincronizar: execute CyberpunkDiario.exe no Windows, mantenha computador e celular na mesma rede Wi-Fi, copie o endereço IP e o código de pareamento exibidos no desktop e informe-os em Ajustes → Sincronização LAN no Android.

            O servidor usa HTTP local autenticado por token. Utilize somente em rede privada confiável e não encaminhe a porta 8765 para a internet.
          files: |
            release/android/app-debug.apk
            release/android/SHA256SUMS.txt
            release/windows/Cyberpunk-Diario-Desktop-Windows.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
