name: Build Cyberpunk Diário Android and Desktop

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'desktop/**'
      - '*.gradle'
      - '*.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Require persistent Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cyberpunk-release.jks"
      - name: Compile signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cyberpunk-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK signature and generate checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile desktop server and embedded app
        run: gradle --no-daemon :desktop:jar
      - name: Package Windows executable with bundled Java runtime
        shell: pwsh
        run: |
          jpackage --type app-image --input desktop/build/libs --dest desktop/build/installer --name CyberpunkDiario --main-jar CyberpunkDiarioDesktop.jar --main-class com.cyberpunkdiario.desktop.DesktopServer --app-version 1.7.1 --vendor "Otavio Dias Leite"
          Compress-Archive -Path desktop/build/installer/CyberpunkDiario -DestinationPath desktop/build/Cyberpunk-Diario-Desktop-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: desktop/build/Cyberpunk-Diario-Desktop-Windows.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build Linux desktop application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile desktop server and embedded app
        run: gradle --no-daemon :desktop:jar
      - name: Package Linux application with bundled Java runtime
        run: |
          jpackage --type app-image --input desktop/build/libs --dest desktop/build/installer --name CyberpunkDiario --main-jar CyberpunkDiarioDesktop.jar --main-class com.cyberpunkdiario.desktop.DesktopServer --app-version 1.7.0 --vendor "Otavio Dias Leite"
          tar -czf desktop/build/Cyberpunk-Diario-Desktop-Linux.tar.gz -C desktop/build/installer CyberpunkDiario
      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-Linux
          path: desktop/build/Cyberpunk-Diario-Desktop-Linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: Cyberpunk-Diario-Linux
          path: release/linux
      - name: Publish Android, Windows and Linux downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: Cyberpunk Diário 1.7.1
          body: |
            Cyberpunk Diário 1.7.1 — Android, Windows e Linux.

            - Nova distribuição desktop para Linux, além de Windows e Android.
            - Tema Soulkiller otimizado para reduzir efeitos gráficos pesados; fonte Orbitron em toda a interface.
            - Ícones do aplicativo Android acompanham o tema selecionado.
            - Tarefas recorrentes diárias e semanais.
            - Notas em Markdown vinculadas a datas, com data padrão de criação.
            - Calendário mensal com cartões maiores e abertura da visão detalhada do dia.
            - Rotação de tela preserva a sessão WebView.
            - Rotinas editáveis com subtarefas e checklists diários que reiniciam sem apagar o histórico.
            - Links associados a tarefas e rotinas.
            - Calendário mensal expandido, com texto em várias linhas.
            - Semana com colunas ampliadas e melhor aproveitamento da tela.
            - Aplicativo Windows com servidor Tailscale; sincronização bidirecional entre redes diferentes sem encaminhar o tráfego geral da internet.
            - Android mantém o mesmo applicationId e incrementa versionCode para atualização direta.

            Para sincronizar: execute CyberpunkDiario.exe no Windows, instale Tailscale no PC e no Android, entre na mesma conta, copie o endereço marcado TAILSCALE e o código de pareamento exibidos no desktop e informe-os em Ajustes → Sincronização Tailscale no Android.

            O servidor usa HTTP autenticado por token dentro da rede privada criptografada pelo Tailscale. Não encaminhe a porta 8765 para a internet. Não é necessário ativar Exit Node.
          files: |
            release/android/app-debug.apk
            release/android/SHA256SUMS.txt
            release/windows/Cyberpunk-Diario-Desktop-Windows.zip
            release/linux/Cyberpunk-Diario-Desktop-Linux.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
