name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle Wrapper is committed yet; install the compatible fixed version.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk-Diario-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine app version from app/build.gradle"
            exit 1
          fi
          TAG="v$VERSION"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cyberpunk Diário $VERSION" \
            --notes "Android debug APK for Cyberpunk Diário $VERSION. Download app-debug.apk and install it on your Android device." \
            || {
              echo "Release $TAG may already exist; uploading the current APK assets."
              gh release upload "$TAG" \
                app/build/outputs/apk/debug/app-debug.apk \
                app/build/outputs/apk/debug/SHA256SUMS.txt \
                --repo "$GITHUB_REPOSITORY" --clobber
            }
